spring.application.name=appfolder
spring.profiles.active=dev

# REST
server.port=8080

# DB — db.type: maria | oracle
db.type=maria
spring.datasource.url=jdbc:mariadb://HOST:PORT/DBNAME?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
db.heartbeat=30

# Redis
spring.data.redis.host=
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

# TCP (custom — Spring has no built-in TCP config)
tcp.ip=0.0.0.0
tcp.port=9000

# JWT
jwt.secret=default-secret-key-change-in-production!!
