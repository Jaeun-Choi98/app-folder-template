spring.application.name=appfolder
spring.profiles.active=dev

# REST
server.port=8080

# DB — db.type: maria | oracle
db.type=maria
spring.datasource.url=jdbc:mariadb://10.1.0.1:33060/apptemplate?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=juchoi
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
db.heartbeat=30

# Redis
spring.data.redis.host=10.1.0.118
spring.data.redis.port=6379
spring.data.redis.password=1234
spring.data.redis.database=0
spring.data.redis.timeout=5000ms

# TCP (custom — Spring has no built-in TCP config)
tcp.ip=0.0.0.0
tcp.port=9000

# JWT
jwt.secret=default-secret-key-change-in-production!!

# SPA static files (paths relative to working directory)
spa.root.static-path=spa-build
spa.root.redirects=/page1,/page2,/page3,/page4
spa.other.url-prefix=/spatest
spa.other.static-path=spa-test
